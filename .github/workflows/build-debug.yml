name: Build Debug APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install SDK and NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found"; exit 1; }
          sdkmanager() { "$SDKMANAGER" "$@"; }
          ALL="$(sdkmanager --list 2>/dev/null)" || true
          PLATFORM="$(echo "$ALL" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -n1 || true)"
          NDK="$(echo "$ALL" | grep -oE 'ndk;27\.2\.12479018' | sort -V | tail -n1 || true)"
          BUILD_TOOLS="$(echo "$ALL" | grep -oE 'build-tools;3[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1 || true)"
          echo "PLATFORM=$PLATFORM NDK=$NDK BUILD_TOOLS=$BUILD_TOOLS"
          [ -n "$PLATFORM" ] || { echo "::error::android-37 not found"; exit 1; }
          [ -n "$NDK" ] || { echo "::error::ndk not found"; exit 1; }
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          ARGS=("$PLATFORM" "$NDK")
          [ -n "$BUILD_TOOLS" ] && ARGS+=("$BUILD_TOOLS")
          sdkmanager "${ARGS[@]}"
          test -d "$SDK_ROOT/platforms/${PLATFORM#platforms;}" || { echo "::error::platform missing"; exit 1; }
          test -d "$SDK_ROOT/ndk/${NDK#ndk;}" || { echo "::error::ndk missing"; exit 1; }
          python3 -c "import sys; print('build python:', sys.version)"

      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AVBox-debug
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/')
        id: apk
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          test -f "$SRC" || { echo "::error::apk not found"; exit 1; }
          OUT="AVBox_${GITHUB_REF_NAME}_debug.apk"
          cp "$SRC" "$OUT"
          echo "apk: $OUT"
          echo "size: $(du -h "$OUT" | cut -f1)"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Read tag message
        if: startsWith(github.ref, 'refs/tags/')
        id: tagmsg
        run: |
          set -euo pipefail
          SUBJECT="$(git for-each-ref --format='%(contents:subject)' "refs/tags/${GITHUB_REF_NAME}")"
          DETAIL="$(git for-each-ref --format='%(contents:body)' "refs/tags/${GITHUB_REF_NAME}")"
          if [ -z "$SUBJECT" ]; then
            SUBJECT="详见提交记录。"
          fi
          {
            echo 'body<<__EOF__'
            echo '### 本次更新'
            echo ''
            echo "$SUBJECT"
            if [ -n "$DETAIL" ]; then
              echo ''
              echo "$DETAIL"
            fi
            echo ''
            echo '### 说明'
            echo ''
            echo "AVBox 个人修改版（debug 构建）。改动细节见 [README 的「本分支的改动」](https://github.com/$GITHUB_REPOSITORY#本分支的改动)，技术细节见 [改动总览](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/AVBox-changes.md)。"
            echo ''
            echo 'debug 签名，可直接覆盖安装；不包含任何影视内容与内容源，仅供学习研究。'
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          body: ${{ steps.tagmsg.outputs.body }}
          files: ${{ steps.apk.outputs.path }}
